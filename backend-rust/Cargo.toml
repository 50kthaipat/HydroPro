[package]
name = "hydroflow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
tokio = { version = "1.35", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"

[dev-dependencies]
tokio-tungstenite = "0.21"
