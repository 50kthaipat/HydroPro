name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Format, Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Formatting
        run: cargo fmt --check || true
      - name: Run Unit Tests
        run: cargo test
      - name: Run Clippy Linter
        run: cargo clippy -- -D warnings

  frontend-checks:
    name: Frontend Lint, Type-Check and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-scada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci || npm install
      - name: Build and Typecheck
        run: npm run build
