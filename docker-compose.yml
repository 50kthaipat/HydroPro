services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hydroflow-backend
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - SIMULATION_MODE=true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hydroflow-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
